name: Déployer le dashboard de l’observatoire

on:
  pull_request:
    paths:
      - "ObservationLLM/*.md"
      - "ObservationLLM/dashboard/**"
      - ".github/workflows/deploy-observatoire-pages.yml"
  push:
    branches: [main]
    paths:
      - "ObservationLLM/*.md"
      - "ObservationLLM/dashboard/**"
      - ".github/workflows/deploy-observatoire-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Valider les données
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les fichiers JSON
        shell: bash
        run: |
          python -m json.tool ObservationLLM/dashboard/data/latest.json >/dev/null
          python -m json.tool ObservationLLM/dashboard/data/run-status.json >/dev/null
          python -m json.tool ObservationLLM/dashboard/data/research-cadence.json >/dev/null
          python -m json.tool ObservationLLM/dashboard/data/source-registry.json >/dev/null
          python -m json.tool ObservationLLM/dashboard/data/announcements.json >/dev/null
          python -m json.tool ObservationLLM/dashboard/data/tools-catalog.json >/dev/null

      - name: Vérifier les cadences et le catalogue
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = Path("ObservationLLM/dashboard/data")
          cadence = json.loads((data / "research-cadence.json").read_text(encoding="utf-8"))
          tools = json.loads((data / "tools-catalog.json").read_text(encoding="utf-8"))
          lanes = cadence.get("lanes", [])
          assert len(lanes) == 5, "Le planning doit contenir cinq lignes"
          assert len({lane["id"] for lane in lanes}) == 5, "Les identifiants de cadence doivent être uniques"
          assert sum(lane["cadence"] == "Chaque semaine" for lane in lanes) == 3, "Trois lignes hebdomadaires sont requises"
          assert sum(lane["cadence"] == "Chaque jour" for lane in lanes) == 1, "Une ligne quotidienne est requise"
          assert sum(lane["cadence"] == "Dès détection" for lane in lanes) == 1, "Une ligne événementielle est requise"
          assert len(tools.get("tools", [])) == 100, "Le catalogue doit contenir exactement 100 outils"
          PY

      - name: Vérifier le JavaScript
        run: node --check ObservationLLM/dashboard/app.js

      - name: Générer les pages de contenu
        run: node ObservationLLM/dashboard/build-content.mjs ObservationLLM/dashboard-dist

      - name: Vérifier les pages générées
        shell: bash
        run: |
          test -f ObservationLLM/dashboard-dist/index.html
          test -f ObservationLLM/dashboard-dist/synthese.html
          test -f ObservationLLM/dashboard-dist/comparatif.html
          test -f ObservationLLM/dashboard-dist/analyse-detaillee.html
          test -f ObservationLLM/dashboard-dist/bonnes-pratiques-developpement.html
          test -f ObservationLLM/dashboard-dist/modeles-locaux-par-hardware.html
          test -f ObservationLLM/dashboard-dist/localisation-modeles.html
          test -f ObservationLLM/dashboard-dist/referentiel-sources.html
          test -f ObservationLLM/dashboard-dist/outils-ecosysteme-ia.html
          test -f ObservationLLM/dashboard-dist/sources.html

  deploy:
    name: Publier sur GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Générer les pages de contenu
        run: node ObservationLLM/dashboard/build-content.mjs ObservationLLM/dashboard-dist

      - name: Préparer l’artefact statique
        uses: actions/upload-pages-artifact@v4
        with:
          path: ObservationLLM/dashboard-dist

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
